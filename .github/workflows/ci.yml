name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/linkarr

jobs:
  check:
    name: Tests and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Run the tests (fake MEGA, TMDB, Telegram and Plex)
        run: python -m pytest -q

      - name: Syntax-check the web app
        run: |
          node --check linkarr/web/app.js
          python -c "import json; json.load(open('linkarr/web/manifest.webmanifest'))"

      - name: Start the app and call /api/health
        run: |
          mkdir -p /tmp/la-data /tmp/la-media
          LA_DATA=/tmp/la-data LA_MEDIA=/tmp/la-media LA_PORT=9040 python -m linkarr > /tmp/app.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9040/api/health && exit 0; sleep 1; done
          cat /tmp/app.log; exit 1

      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  image:
    name: Build image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: App version
        id: version
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('linkarr/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=pr

      # Starts the real image once, as Unraid would, before anything is published.
      - name: Smoke-test the container
        run: |
          docker buildx build --load -t linkarr-smoke .
          docker run --rm --entrypoint sh linkarr-smoke -c 'command -v mega-get && command -v unar && command -v ffprobe'
          sudo mkdir -p /tmp/smoke-data /tmp/smoke-media/Movies && sudo chown root:root /tmp/smoke-data && sudo chown -R 99:100 /tmp/smoke-media
          docker run -d --name smoke -p 9040:9040 -e LA_COOKIE_SECURE=0 -v /tmp/smoke-data:/data -v /tmp/smoke-media:/media linkarr-smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9040/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:9040/api/health
          test "$(docker top smoke -o pid,uid,comm | awk '$3 ~ /python/ {print $2}')" = 99 || { echo "The app isn't running as 99"; docker top smoke -o pid,uid,comm; docker logs smoke; exit 1; }
          sudo stat -c '%u:%g' /tmp/smoke-data | grep -qx '99:100'
          docker logs smoke 2>&1 | grep -q "setup code" || { echo "No setup code in the log"; docker logs smoke; exit 1; }
          start=$(date +%s); docker stop -t 30 smoke; took=$(( $(date +%s) - start ))
          test "$took" -lt 10 || { echo "Took $took s to stop"; exit 1; }
          docker rm smoke

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
